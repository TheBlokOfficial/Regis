<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Regis Agent OS - Web Control Console Interface" />
  <title>Regis OS - Control Console</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div id="app">
    <main style="padding: 40px; text-align: center;">
      <h1 id="app-title" style="font-weight: 600; color: var(--text-primary);">Regis Agent OS</h1>
      <p style="color: var(--text-secondary); margin-top: 8px;">Embedded Control Console</p>
      <div style="margin-top: 24px;">
        <span class="status-badge" id="server-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Oczekiwanie na inicjalizację...</span>
        </span>
      </div>
    </main>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
