<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Regis Agent OS - Web Control Console Interface" />
  <title>Regis OS - Control Console</title>
  <link rel="stylesheet" href="./css/base/tokens.css" />
  <link rel="stylesheet" href="./css/base/reset.css" />
  <link rel="stylesheet" href="./css/layout/shell.css" />
  <link rel="stylesheet" href="./css/components/cards.css" />
  <link rel="stylesheet" href="./css/components/buttons.css" />
  <link rel="stylesheet" href="./css/components/forms.css" />
  <link rel="stylesheet" href="./css/components/badges.css" />
  <link rel="stylesheet" href="./css/components/modal.css" />
  <link rel="stylesheet" href="./css/components/toast.css" />
  <link rel="stylesheet" href="./css/components/select.css" />
  <link rel="stylesheet" href="./css/components/section_layout.css" />
  <link rel="stylesheet" href="./css/views/providers.css" />
  <link rel="stylesheet" href="./css/views/settings.css" />
  <link rel="stylesheet" href="./css/views/dashboard.css" />
  <link rel="stylesheet" href="./css/views/chat.css" />
  <link rel="stylesheet" href="./css/views/agents.css" />
  <link rel="stylesheet" href="./css/views/agent.css" />
  <link rel="stylesheet" href="./css/views/extensions.css" />
  <link rel="stylesheet" href="./css/views/voice.css" />
  <link rel="stylesheet" href="./css/components/pill_tabs.css" />
</head>
<body>
  <div id="app">
    <!-- PASEK BOCZNY (SIDEBAR) -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-header">
          <div class="brand-box">
            <div class="brand-logo" id="brand-logo-svg"></div>
            <span class="brand-title">REGIS OS</span>
            <span class="brand-tag">v0.1</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-group">
            <div class="nav-group-title">Nawigacja</div>
            <a href="#" class="nav-item active" data-tab="dashboard" id="nav-dashboard">
              <span class="nav-icon" id="icon-nav-dashboard"></span>
              <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-tab="chat" id="nav-chat">
              <span class="nav-icon" id="icon-nav-chat"></span>
              <span>Czat</span>
            </a>
          </div>

          <div class="nav-group">
            <div class="nav-group-title">System</div>
            <a href="#" class="nav-item" data-tab="settings" id="nav-settings">
              <span class="nav-icon" id="icon-nav-settings"></span>
              <span>Ustawienia</span>
            </a>
          </div>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="connection-status">
          <span class="status-indicator-dot" id="sidebar-status-dot"></span>
          <span id="sidebar-status-text">Łączenie...</span>
        </div>
      </div>
    </aside>

    <!-- OBSZAR ROBOCZY (WORKSPACE) -->
    <div class="workspace">
      <header class="workspace-header">
        <div class="breadcrumbs">
          <span class="breadcrumb-root">Regis OS</span>
          <span id="breadcrumb-chevron"></span>
          <span class="breadcrumb-active" id="breadcrumb-active-tab">Dashboard</span>
        </div>

        <div class="header-actions">
          <button class="btn-icon" id="btn-refresh" title="Odśwież status połączenia" aria-label="Odśwież status połączenia"></button>
        </div>
      </header>

      <main id="workspace-content" class="workspace-content">
        <!-- Zawartość zakładki renderowana dynamicznie przez TabManager -->
      </main>
    </div>
  </div>

  <!-- KONTENER NA MODALE / POP-UPY -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
