[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server"
# Wersja PAKIETU — nieistotna, nic go nie publikuje ani nie instaluje po numerze.
# Wersją PRODUKTU jest `shared.__version__` (packages/shared/src/shared/version.py).
version = "0.1.0"
description = "Główny serwer obsługujący WebSockets oraz API REST (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "livekit-wakeword>=0.1",
    "groq>=0.11",
    "elevenlabs>=1.0",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
