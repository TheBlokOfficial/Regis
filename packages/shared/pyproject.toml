[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared"
# Wersja PAKIETU — nieistotna, nic go nie publikuje ani nie instaluje po numerze.
# Wersją PRODUKTU jest `shared.__version__` (packages/shared/src/shared/version.py).
version = "0.1.0"
description = "Wspólna paczka dla systemu rozproszonego Regis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
