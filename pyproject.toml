[project]
name = "regis-monorepo"
version = "0.1.0"
description = "Monorepo systemu usług rozproszonych Regis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "server",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }
server = { workspace = true }

[tool.uv.workspace]
members = [
    "services/*",
    "packages/*",
]
