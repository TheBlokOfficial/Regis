[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regis"
version = "0.1.0"
description = "Lekka warstwa abstrakcji miedzy uzytkownikiem a systemem Smart Home"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
controller = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
]
worker = [
    "vosk>=0.3.45",
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.4",
    "piper-tts>=1.2.0",
]

node = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "vosk>=0.3.45",
    "openwakeword>=0.6.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "python-multipart>=0.0.9",
    "psutil>=5.9.0",
    "rich==13.7.0",
    "questionary==2.0.1",
    "websockets>=12.0",
]
dev = [
    "rich==13.7.0",
    "questionary==2.0.1",
    "pytest>=7.4.3",
    "pyinstaller>=6.9.0",
    "build>=1.2.1",
]
all = [
    "regis[controller]",
    "regis[worker]",

    "regis[node]",
    "regis[dev]",
]

[project.scripts]
regis-controller = "controller.main:start"
regis-worker     = "worker.node:start"
regis            = "node.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "integrations*", "controller*", "node*"]
