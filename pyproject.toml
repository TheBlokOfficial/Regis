[project]
name = "regis-monorepo"
version = "0.1.0"
description = "Monorepo systemu usług rozproszonych Regis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "server",
]

[dependency-groups]
# Zależności deweloperskie instalowane domyślnie przez `uv sync`.
# `anyio` dostarcza wtyczkę pytest obsługującą marker `@pytest.mark.anyio`,
# którego używa cały zestaw testów (nie jest potrzebny `pytest-asyncio`).
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }
server = { workspace = true }

[tool.uv.workspace]
members = [
    "services/*",
    "packages/*",
]

[tool.pytest.ini_options]
pythonpath = [
    "services/server/src",
    "packages/shared/src",
]

